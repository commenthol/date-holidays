holidays:
  MA:
    names:
      ar: "المملكة المغربية"
      fr: Royaume du Maroc
      en: Kingdom of Morocco
    langs:
      - ar
      - ber
      - fr
    zones:
      - Africa/Casablanca
    dayoff: sunday
    days:
      01-01:
        _name: 01-01
        name:
          ar: "رأس السنة الميلادية"
      01-11:
        name:
          fr: Manifeste de l'indépendance
          ar: "ذكرى تقديم وثيقة الاستقلال"
          en: Proclamation of Independence Day
      01-14 since 2024:
        name:
          fr: Nouvel An amazigh
          ar: "رأس السنة الأمازيغية"
          en: Amazigh New Year
      05-01:
        _name: 05-01
        name:
          ar: "عيد الشغل"
      07-30:
        name:
          fr: Fête du trône
          ar: "عيد العرش"
          en: Throne Day
      08-14:
        name:
          fr: Allégeance Oued Eddahab
          ar: "ذكرى استرجاع إقليم وادي الذهب"
          en: Oued Ed-Dahab Day
      08-20:
        name:
          fr: Révolution du Roi et du Peuple
          ar: "ذكرى ثورة الملك والشعب"
          en: Revolution Day
      08-21:
        name:
          fr: Fête de la jeunesse
          ar: "عيد الشباب"
          en: Youth Day
      10-31 since 2026:
        name:
          fr: Fête de l'Unité
          ar: "عيد الوحدة"
          en: Unity Day
      11-06:
        name:
          fr: Marche verte
          ar: "ذكرى المسيرة الخضراء"
          en: Green March Day
      11-18:
        _name: Independence Day
        name:
          fr: Fête de l'indépendance
      1 Muharram:
        disable:
          - '2021-08-09'
          - '2025-06-26'
          - '2026-06-16'
        enable:
          - '2021-08-10'
          - '2025-06-27'
          - '2026-06-17'
        _name: 1 Muharram
        name:
          fr: Jour de l'an hégire
          ar: "فاتح محرم"
      12 Rabi al-awwal:
        disable:
          - '2021-10-18'
          - '2022-10-08'
          - '2023-09-27'
          - '2024-09-15'
          - '2025-09-04'
        enable:
          - '2021-10-19'
          - '2022-10-09'
          - '2023-09-28'
          - '2024-09-16'
          - '2025-09-05'
        _name: 12 Rabi al-awwal
        name:
          fr: Aïd Al-Mawlid Annabawi
          ar: "عيد المولد النبوي"
      1 Shawwal:
        disable:
          - '2023-04-21'
          - '2025-03-30'
        enable:
          - '2023-04-22'
          - '2025-03-31'
        _name: 1 Shawwal
        name:
          fr: Aïd Al-Fitr
      10 Dhu al-Hijjah:
        disable:
          - '2021-07-20'
          - '2022-07-09'
          - '2023-06-28'
          - '2024-06-16'
          - '2025-06-06'
        enable:
          - '2021-07-21'
          - '2022-07-10'
          - '2023-06-29'
          - '2024-06-17'
          - '2025-06-07'
        _name: 10 Dhu al-Hijjah
        name:
          fr: Aïd Al-Adha

