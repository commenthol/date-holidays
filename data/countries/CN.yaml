          en: Chongyang Festival
          zh: 重阳节
        type: observance
        note: National ICH list (2006, Ⅹ-6); also Senior Citizens' Day since 2013; not a day off
      chinese 10-0-01:
        name:
          en: Winter Clothing Festival
          zh: 寒衣节
