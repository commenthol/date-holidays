        name:
          en: Victory Day of the Chinese People's War of Resistance Against Japanese Aggression
          zh: 中国人民抗日战争胜利纪念日
        type: observance
        note: NPC Standing Committee decision 2014; 放假办法第五条; not a day off
      # @source https://www.gov.cn/zhengce/2016-03/19/content_5055467.htm
      09-05:
        name:
          en: China Charity Day
          zh: 中华慈善日
        type: observance
        note: Charity Law, Art. 7; not a day off
        active:
          - from: "2016-01-01"
      09-10:
        name:
          en: Teachers' Day
          zh: 教师节
        type: observance
        note: NPC Standing Committee decision 1985; 放假办法第五条; not a day off
        active:
          - from: "1985-01-01"
      09-18:
        name:
          en: September 18th Incident Memorial Day
          zh: 九一八纪念日
        type: observance
        note: 放假办法第五条; not a day off
      # @source http://www.npc.gov.cn/zgrdw/npc/lfzt/rlyw/2017-12/27/content_2035501.htm
      09-30:
        name:
          en: Martyrs' Day
          zh: 烈士纪念日
        type: observance
        note: NPC Standing Committee decision 2014; not a day off
        active:
          - from: "2014-01-01"
      10-17:
        name:
          en: National Poverty Relief Day
          zh: 国家扶贫日
        type: observance
        note: State Council decision 2014; not a day off
        active:
          - from: "2014-01-01"
      11-08:
        name:
          en: Journalists' Day
          zh: 记者节
        type: observance
        note: State Council approval 2000; 放假办法第五条; not a day off
        active:
          - from: "2000-01-01"
      # @source https://www.gov.cn/zhengce/content/2012-11/21/content_3357.htm
      12-02:
        name:
          en: National Traffic Safety Day
          zh: 全国交通安全日
        type: observance
        note: State Council approval 2012 (国函〔2012〕195号); not a day off
        active:
          - from: "2012-01-01"
      # @source http://www.npc.gov.cn/npc/c1773/c2518/gjxfr/gjxfr002/201912/t20191203_256312.html
      12-04:
        name:
          en: National Constitution Day
          zh: 国家宪法日
        type: observance
        note: NPC Standing Committee decision 2014; not a day off
        active:
          - from: "2014-01-01"
      12-13:
        name:
          en: National Memorial Day for Nanjing Massacre Victims
          zh: 南京大屠杀死难者国家公祭日
        type: observance
        note: NPC Standing Committee decision 2014; not a day off
        active:
          - from: "2014-01-01"
      # @source https://www.gov.cn/guoqing/2021-10/29/content_5647618.htm
      3rd Sunday in May:
        name:
          en: National Day for Helping the Disabled
          zh: 全国助残日
        type: observance
        note: Law on the Protection of Persons with Disabilities, Art. 14; not a day off
        active:
          - from: "1991-01-01"
      # @source https://www.gov.cn/gongbao/content/2001/content_61077.htm
      3rd Saturday in September:
        name:
          en: National Defense Education Day
          zh: 全民国防教育日
        type: observance
        note: NPC Standing Committee decision 2001; not a day off
        active:
          - from: "2001-01-01"
      # @source https://www.gov.cn/gongbao/content/2006/content_185117.htm
      2nd Saturday in June:
        name:
          en: Cultural and Natural Heritage Day
          zh: 文化和自然遗产日
        type: observance
        note: State Council 2006; renamed in 2017; not a day off
        active:
          - from: "2006-01-01"

      # Traditional festivals from the national ICH list
      chinese 01-0-15:
