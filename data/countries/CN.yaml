      # --- Observances (not days off) ---
      # National memorial days, theme days, traditional festivals and solar terms.
      # @source https://www.gov.cn/zhengce/zhengceku/202411/content_6986381.htm
      # @source https://www.ihchina.cn/project.html
      # @source https://www.mct.gov.cn/whzx/bnsj/dwwhllj/201612/t20161214_773196.html

      # @source https://www.gov.cn/zhengce/content/2020-07/21/content_5528614.htm
      01-10:
        name:
          en: Chinese People's Police Day
          zh: 中国人民警察节
        type: observance
        note: State Council approval 2020 (国函〔2020〕98号); not a day off
        active:
          - from: "2021-01-01"
      02-07:
        name:
          en: February 7th Memorial Day
          zh: 二七纪念日
        type: observance
        note: 京汉铁路工人大罢工纪念日; 放假办法第五条; not a day off
      03-12:
        name:
          en: National Tree Planting Day
          zh: 植树节
        type: observance
        note: NPC Standing Committee resolution 1979; 放假办法第五条; not a day off
        active:
          - from: "1979-01-01"
      # @source https://www.gov.cn/zhengce/2015-07/01/content_2893902.htm
      04-15:
        name:
          en: National Security Education Day
          zh: 全民国家安全教育日
        type: observance
        note: National Security Law, Art. 14; not a day off
        active:
          - from: "2016-01-01"
      # @source https://www.gov.cn/zhengce/content/2016-03/21/content_5055835.htm
      04-24:
        name:
          en: China Space Day
          zh: 中国航天日
        type: observance
        note: State Council approval 2016 (国函〔2016〕50号); not a day off
        active:
          - from: "2016-01-01"
      # @source https://www.gov.cn/zhengce/zhengceku/2017-05/02/content_5190380.htm
      05-10:
        name:
          en: China Brand Day
          zh: 中国品牌日
        type: observance
        note: State Council approval 2017 (国函〔2017〕51号); not a day off
        active:
          - from: "2017-01-01"
      05-12:
        name:
          en: Nurses' Day
          zh: 护士节
        type: observance
        note: International Nurses Day; 放假办法第五条; not a day off
      "05-12 #1":
        name:
          en: National Disaster Prevention and Reduction Day
          zh: 全国防灾减灾日
        type: observance
        note: State Council approval 2009; not a day off
        active:
          - from: "2009-01-01"
      05-19:
        name:
          en: China Tourism Day
          zh: 中国旅游日
        type: observance
        note: State Council approval 2011; not a day off
        active:
          - from: "2011-01-01"
      05-30:
        name:
          en: May 30th Movement Memorial Day
          zh: 五卅纪念日
        type: observance
        note: 五卅运动纪念日; 放假办法第五条; not a day off
      # @source https://www.gov.cn/zhengce/content/2016-12/13/content_5147397.htm
      "05-30 #1":
        name:
          en: National Science and Technology Workers' Day
          zh: 全国科技工作者日
        type: observance
        note: State Council approval 2016 (国函〔2016〕194号); not a day off
        active:
          - from: "2017-01-01"
      06-25:
        name:
          en: National Land Day
          zh: 全国土地日
        type: observance
        note: State Council decision 1991; not a day off
        active:
          - from: "1991-01-01"
      07-01:
        name:
          en: Anniversary of the Founding of the Communist Party of China
          zh: 建党纪念日
        type: observance
        note: Established by the CPC Central Committee in 1941; not a statutory holiday
      07-07:
        name:
          en: July 7th Incident Memorial Day
          zh: 七七抗战纪念日
        type: observance
        note: 全民族抗战爆发纪念日; 放假办法第五条; not a day off
      # @source https://www.gov.cn/zhengce/content/2008-03/28/content_1191.htm
      07-11:
        name:
          en: China Maritime Day
          zh: 中国航海日
        type: observance
        note: State Council approval 2005 (国函〔2005〕34号); not a day off
        active:
          - from: "2005-01-01"
      08-08:
        name:
          en: National Fitness Day
          zh: 全民健身日
        type: observance
        note: State Council approval 2009; not a day off
        active:
          - from: "2009-01-01"
      # @source http://www.npc.gov.cn/npc/c2/c30834/202306/t20230628_430329.html
      08-15:
        name:
          en: National Ecology Day
          zh: 全国生态日
        type: observance
        note: NPC Standing Committee decision 2023; not a day off
        active:
          - from: "2023-01-01"
      # @source https://www.gov.cn/zhengce/zhengceku/2017-11/20/content_5241021.htm
      08-19:
        name:
          en: Chinese Doctors' Day
          zh: 中国医师节
        type: observance
        note: State Council approval 2017 (国函〔2017〕136号); not a day off
        active:
