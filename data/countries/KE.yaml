holidays:
  # @source http://www.kenyalaw.org/kl/fileadmin/pdfdownloads/Acts/PublicHolidaysActCap110.pdf
  KE:
    names:
      en: Kenya
    dayoff: sunday
    langs:
      - sw
      - en
    zones:
      - Africa/Nairobi
    days:
      01-01 and if sunday then next monday:
        substitute: true
        _name: 01-01
      easter -2:
        _name: easter -2
      easter:
        _name: easter
      easter 1:
        _name: easter 1
      05-01 and if sunday then next monday:
        substitute: true
        _name: 05-01
      06-01 and if sunday then next monday:
        substitute: true
        name:
          sw: Siku ya Madaraka
          en: Madaraka Day
      # Renamed Mazingira Day by the Statute Law (Miscellaneous Amendments) Act, 2024 (No. 3 of 2024)
      # @source https://kenyalaw.org/akn/ke/act/1912/21/eng@2024-04-26
      # @source https://www.the-star.co.ke/news/2024-04-24-october-10-utamaduni-day-renamed-mazingira-day
      10-10 and if sunday then next monday:
        substitute: true
        name:
          sw: Siku ya Mazingira
          en: Mazingira Day
        active:
          - from: 2024-01-01
      "10-10 and if sunday then next monday #1":
        substitute: true
        name:
          en: Moi Day
        active:
          - to: 2024-01-01
      10-20 and if sunday then next monday:
        substitute: true
        name:
          sw: Siku ya Mashujaa
          en: Mashujaa Day
      12-12 and if sunday then next monday:
        substitute: true
        name:
          sw: Siku ya Jamhuri
          en: Jamhuri Day
      12-25 and if sunday then next tuesday:
        substitute: true
        _name: 12-25
      12-26 and if sunday then next monday:
        substitute: true
        _name: 12-26
      1 Shawwal:
        _name: 1 Shawwal
      10 Dhu al-Hijjah:
        _name: 10 Dhu al-Hijjah
        note: For all persons belonging to the Islamic faith.
      # Diwali:
      # _name: Diwali
      # note: For all persons belonging to the Hindu faith.
