          zh: 國父逝世紀念日
        type: observance
      03-29:
        name:
          en: Youth Day
          zh: 靑年節
        type: observance
      05-01 and if Saturday then previous Friday if Sunday then next Monday:
        substitute: true
        _name: 05-01
        name:
          zh: 勞動節
        type: observance
        note: private sector
        active:
          - to: "2025-05-28"
      05-04:
        name:
          en: Literary Day
          zh: 文藝節
        type: observance
      2nd Sunday in May:
        _name: Mothers Day
        name:
          zh: 母親節
        type: observance
      06-03:
        name:
          en: Opium Suppression Movement Day
          zh: 禁菸節
        type: observance
      08-08:
        _name: Fathers Day
        name:
          zh: 父親節
        type: observance
      09-01:
        name:
          en: Journalist’ Day
          zh: 記者節
        type: observance
      09-03:
        name:
          en: Armed Forces Day
          zh: 軍人節
        type: observance
      09-28:
        name:
          en: Teachers’ Day
          zh: 孔子誕辰紀念日
        type: observance
        active:
          - to: "2025-05-28"
      10-21:
        name:
