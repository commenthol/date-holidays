      11-12:
        name:
          en: Sun Yat-sen’s Birthday
          zh: 國父誕辰紀念日
        note: Also Doctors' Day and Cultural Renaissance Day
        type: observance
      december solstice:
        name:
          en: Dongzhi Festival
          zh: 冬至
        type: observance
      12-25:
        name:
          en: Constitution Day
          zh: 行憲紀念日
        type: observance
        active:
          - to: "2025-05-28"
      chinese 01-0-15:
        name:
          en: Lantern Festival
          zh: 元宵節
        type: observance
      "chinese 01-0-15 #1":
        name:
          en: Tourism Day
          zh: 觀光節
        type: observance
      chinese 02-0-02:
