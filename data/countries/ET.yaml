holidays:
  # @attrib https://en.wikipedia.org/wiki/Public_holidays_in_Ethiopia
  # @source http://holidays.ertale.com/
  ET:
    names:
      am: ኢትዮጵያ
      en: Ethiopia
    dayoff: sunday
    langs:
      - am
      - en
    zones:
      - Africa/Nairobi
    days:
      julian 12-25:
        _name: 12-25
      # 11 Ter = julian 01-06, or 01-07 if year % 4 = 0 (after Pagume 6)
      julian 01-06 in odd years:
        _name: 01-06
      julian 01-06 every 4 years since 1902:
        _name: 01-06
      julian 01-07 every 4 years since 1904:
        _name: 01-06
      03-02:
        name:
          am: የዓድዋ ድል በዓል
          en: Victory at Adwa Day
      03-28:
        name:
          am: የቀይ ሽብር መታሰቢያ ቀን
          en: Day of Lament
      orthodox -2:
        _name: easter -2
      orthodox:
        _name: easter
      05-28:
        name:
          am: ደርግ የወደቀበት ቀን
          en: Derg Downfall Day
      # 1 Meskerem = julian 08-29, or 08-30 if year % 4 = 3 (after Pagume 6)
      julian 08-29 in even years:
        _name: 01-01
      julian 08-29 every 4 years since 1901:
        _name: 01-01
      julian 08-30 every 4 years since 1903:
        _name: 01-01
      # 17 Meskerem = julian 09-14, or 09-15 if year % 4 = 3
      julian 09-14 in even years:
        name:
          am: ብርሐነ-መስቀል
          en: Finding of the True Cross
      julian 09-14 every 4 years since 1901:
        name:
          am: ብርሐነ-መስቀል
          en: Finding of the True Cross
      julian 09-15 every 4 years since 1903:
        name:
          am: ብርሐነ-መስቀል
          en: Finding of the True Cross
      1 Ramadan:
        _name: 1 Ramadan
      12 Rabi al-awwal:
        _name: 12 Rabi al-awwal
      1 Shawwal:
        _name: 1 Shawwal
      10 Dhu al-Hijjah:
        _name: 10 Dhu al-Hijjah
